function fil(cat){var q=ev('q').toLowerCase(),so=ev('so'),all=cat=='all',tot=all?D.prods.length:D.prods.filter(p=>p.cat==cat).length,a=D.prods.filter(p=>(all?(CF=='all'||p.cat==CF):p.cat==cat)&&p.name.toLowerCase().includes(q));
if(so=='a')a.sort((x,y)=>x.price-y.price);if(so=='d')a.sort((x,y)=>y.price-x.price);if(so=='n')a.sort((x,y)=>x.name.localeCompare(y.name));
a=group(a);
document.getElementById('g').innerHTML=a.map(item).join('')||'<p>Tidak ada item.</p>';
document.getElementById('cnt').innerHTML=`MENAMPILKAN <span style='color:var(--accent)'>${a.length}</span> DARI ${tot} ITEM &nbsp; KATEGORI: ${all?(CF=='all'?'SEMUA':catName(CF)):catName(cat)}`}
function splitName(p){var i=p.name.indexOf(" - ");return i>-1?{base:p.name.slice(0,i),role:p.name.slice(i+3)}:{base:p.name,role:""}}
function roleView(base){var items=D.prods.filter(function(p){return p.cat=="bug"&&splitName(p).base==base});
 if(!items.length)return '<div class="card"><p>Produk tidak ditemukan.</p><a class="btn red" href="#produk">Ke katalog</a></div>';
 if(!order||splitName(order).base!=base)order=items[0];
 var roles=items.map(function(p){var r=splitName(p).role||"Default",on=order.id==p.id;return '<button class="btn'+(on?' red':'')+' sm" onclick="selectRole('+p.id+')">'+esc(r)+' – '+rp(p.price)+'</button>'}).join("");
 return '<h1>Pilih <span class="hl">Role</span></h1><p style="margin:12px 0">'+esc(base)+' – pilih tingkatan yang kamu mau, lalu lanjut ke pembayaran di bawah.</p><div class="card" style="display:flex;flex-wrap:wrap;gap:8px">'+roles+'</div><h1 style="margin-top:26px">Bayar <span class="hl">Pesanan</span></h1><p style="margin:12px 0 18px">Pesanan kamu sudah disiapkan. Pindai QR pembayaran di bawah, lalu kirim bukti ke admin supaya file langsung dikirim ke chat.</p><div class="qrbox"><h2>SCAN QR PEMBAYARAN</h2><p style="font-weight:600">'+esc(order.name)+'</p><div class="qrw"><img class="qr" src="'+(D.qr||qrDef)+'" alt="QR pembayaran"><div class="price">'+rp(order.price)+'</div><small>Nominal harus sama persis agar pesanan bisa langsung diproses admin.</small></div><p style="margin:14px 0 4px">No Admin: <b>'+esc(D.wa)+'</b></p><p style="margin:0">Telegram: <b>@'+esc(D.tele)+'</b></p></div><a class="btn red" target="_blank" rel="noopener" href="https://wa.me/'+esc(D.wa)+'?text='+encodeURIComponent("Halo admin, saya sudah bayar "+order.name+" ("+rp(order.price)+")")+'">💬 Konfirmasi via WhatsApp</a><a class="btn" target="_blank" rel="noopener" href="https://t.me/'+esc(D.tele)+'">✈ Telegram Admin</a>'}
function selectRole(id){order=D.prods.filter(function(p){return p.id==id})[0];go()}
function buy(id){var p=D.prods.filter(function(p){return p.id==id})[0];order=p;location.hash=p.cat=="bug"?"role/"+encodeURIComponent(splitName(p).base):"bayar"}
function view(h){
 if(h=="produk")return listPage("all","BIG LIST APK &amp;","TOOLS DIGITAL");
 if(h=="premium")return listPage("premium","APK PREMIUM","TERLENGKAP");
 if(h=="testimoni")return '<h1>Kata <span class="hl">Mereka</span></h1><div style="height:16px"></div>'+D.testi.map(function(t,i){return '<div class="card t'+(i%2?' r':'')+'"><h2>😎 '+esc(t.n)+'</h2><p>'+esc(t.t)+'</p></div>'}).join("")+'<div class="card"><h2>Tulis testimoni</h2><input id="tn" placeholder="Nama"><textarea id="tt" rows="3" placeholder="Pesanmu"></textarea><button class="btn red" onclick="addT()">Kirim</button></div>';
 if(h=="chat")return '<h1>Chat <span class="hl">Admin</span></h1><div style="height:16px"></div><div class="card"><input id="cn" placeholder="Nama kamu"><textarea id="cm" rows="4" placeholder="Tulis pesan..."></textarea><button class="btn red" onclick="sendWA()">💬 Kirim via WhatsApp</button><a class="btn" target="_blank" rel="noopener" href="https://t.me/'+esc(D.tele)+'">✈ Buka Telegram</a><small>No admin: '+esc(D.wa)+' · Telegram: @'+esc(D.tele)+'</small></div>';
 if(h.indexOf("role/")==0)return roleView(decodeURIComponent(h.slice(5)));
 if(h=="bayar"){if(!order)return '<div class="card"><p>Belum ada order. Pilih produk dulu.</p><a class="btn red" href="#produk">Ke katalog</a></div>';
  return '<h1>Bayar Pesanan <span class="hl">Lewat QR</span></h1><p style="margin:12px 0 18px">Pesanan kamu sudah disiapkan. Pindai QR pembayaran di bawah, lalu kirim bukti ke admin supaya file langsung dikirim ke chat.</p><div class="qrbox"><h2>SCAN QR PEMBAYARAN</h2><p style="font-weight:600">'+esc(order.name)+'</p><div class="qrw"><img class="qr" src="'+(D.qr||qrDef)+'" alt="QR pembayaran"><div class="price">'+rp(order.price)+'</div><small>Nominal harus sama persis agar pesanan bisa langsung diproses admin.</small></div><p style="margin:14px 0 4px">No Admin: <b>'+esc(D.wa)+'</b></p><p style="margin:0">Telegram: <b>@'+esc(D.tele)+'</b></p></div><a class="btn red" target="_blank" rel="noopener" href="https://wa.me/'+esc(D.wa)+'?text='+encodeURIComponent("Halo admin, saya sudah bayar "+order.name+" ("+rp(order.price)+")")+'">💬 Konfirmasi via WhatsApp</a><a class="btn" target="_blank" rel="noopener" href="https://t.me/'+esc(D.tele)+'">✈ Telegram Admin</a>'}
 if(h=="admin")return admin();
 return D.layout.home.map(function(k){return secs[k]()}).join("")
}
function uploadBox(k,w){return '<input type="file" accept="image/*" onchange="img(this,\'' + k + '\',' + w + ')"><div style="display:flex;gap:6px;margin-top:4px"><input id="u_' + k + '" placeholder="atau tempel link gambar (URL)"><button class="btn sm" onclick="urlImg(\'' + k + '\')">Pakai</button></div>'}
function urlImg(k){var v=ev('u_'+k);if(!v)return;D[k]=v;save();theme();go()}
function admin(){
 if(!authed)return '<h1>Admin <span class="hl">Panel</span></h1><div class="card" style="margin-top:16px"><p>Masukkan kata kunci:</p><input id="pw" type="password" placeholder="Kata kunci"><button class="btn red" onclick="login()">Masuk</button></div>';
 var t=D.theme,L=D.layout;
 return '<h1>Admin <span class="hl">Panel</span></h1><div style="height:16px"></div>'+
 '<div class="card"><h2>📷 Foto halaman awal</h2>'+(D.hero?'<img class="qr" style="max-width:100%" src="'+D.hero+'" alt="Foto">':'<div class="ph" style="margin-bottom:10px">BELUM ADA FOTO</div>')+uploadBox('hero',900)+(D.hero?'<button class="btn" onclick="D.hero=\'\';save();go()">Hapus foto</button>':'')+'<small>Foto langsung tampil di bagian bawah beranda.</small></div>'+
 '<div class="card"><h2>1. Ubah harga &amp; produk</h2><div class="scroll">'+D.prods.map(function(p){return '<div class="tbl"><input value="'+esc(p.name)+'" onchange="upd('+p.id+',\'name\',this.value)"><input type="number" value="'+p.price+'" onchange="upd('+p.id+',\'price\',this.value)"><button class="btn sm" onclick="del('+p.id+')">✖</button></div>'}).join("")+'</div></div>'+
 '<div class="card"><h2>2. Tambah produk</h2><input id="an" placeholder="Nama produk"><input id="ap" type="number" placeholder="Harga"><input id="ad" placeholder="Deskripsi"><select id="ac"><option value="bug">APK Bug</option><option value="premium">APK Premiere</option><option value="web">Web &amp; Nokos</option><option value="script">Script &amp; Bot</option></select><button class="btn red" onclick="addP()">Tambah</button></div>'+
 '<div class="card"><h2>3. Tema &amp; warna</h2><p>Latar <input type="color" id="c1" value="'+t.bg+'"></p><p>Kartu <input type="color" id="c2" value="'+t.card+'"></p><p>Tombol/aksen <input type="color" id="c3" value="'+t.accent+'"></p><p>Teks &amp; garis <input type="color" id="c4" value="'+t.text+'"></p><button class="btn red" onclick="saveTheme()">Simpan tema</button><button class="btn" onclick="resetTheme()">Reset</button></div>'+
 '<div class="card"><h2>4. Tata letak</h2><p>Kolom produk: <select onchange="D.layout.cols=+this.value;save();theme();go()">'+[1,2,3,4].map(function(n){return '<option'+(L.cols==n?' selected':'')+'>'+n+'</option>'}).join("")+'</select></p><p>Urutan halaman awal:</p>'+L.home.map(function(k,i){return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><b style="min-width:70px">'+k+'</b><button class="btn sm" onclick="mv('+i+',-1)">▲</button><button class="btn sm" onclick="mv('+i+',1)">▼</button></div>'}).join("")+'<p>Nama toko</p><input value="'+esc(D.title)+'" onchange="D.title=this.value;save();theme()"><p>Slogan</p><input value="'+esc(D.tag)+'" onchange="D.tag=this.value;save();theme()"><p>Logo</p>'+uploadBox('logo',200)+'</div>'+
 '<div class="card"><h2>5. QR &amp; kontak</h2><img class="qr" src="'+(D.qr||qrDef)+'" alt="QR">'+uploadBox('qr',700)+'<p>No admin (format 62...)</p><input value="'+esc(D.wa)+'" onchange="D.wa=this.value;save()"><p>Username Telegram</p><input value="'+esc(D.tele)+'" onchange="D.tele=this.value.replace(\'@\',\'\');save()"></div>'+
 '<button class="btn" onclick="authed=false;go()">Keluar</button>'
}
function login(){if(document.getElementById("pw").value===PASS){authed=true;go()}else alert("Kata kunci salah")}
function upd(id,f,v){D.prods.forEach(function(p){if(p.id==id)p[f]=f=="price"?+v:v});save()}
function del(id){if(confirm("Hapus produk?")){D.prods=D.prods.filter(function(p){return p.id!=id});save();go()}}
function addP(){var n=ev("an"),p=+ev("ap");if(!n||!p)return alert("Isi nama dan harga");D.prods.push({id:Date.now(),cat:ev("ac"),name:n,price:p,desc:ev("ad")});save();go()}
function saveTheme(){D.theme={bg:ev("c1"),card:ev("c2"),accent:ev("c3"),text:ev("c4"),custom:true};save();theme();alert("Tema tersimpan")}
function resetTheme(){D.theme={bg:"#fbf6ea",card:"#fffdf7",accent:"#e62b2b",text:"#140a06",custom:false};save();location.reload()}
function mv(i,d){var a=D.layout.home,j=i+d;if(j<0||j>=a.length)return;var x=a[i];a[i]=a[j];a[j]=x;save();go()}
function img(el,k,w){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=Math.min(1,w/im.width),c=document.createElement("canvas");c.width=im.width*m;c.height=im.height*m;c.getContext("2d").drawImage(im,0,0,c.width,c.height);D[k]=c.toDataURL(k=="qr"?"image/png":"image/jpeg",.85);save();theme();go()};im.src=r.result};r.readAsDataURL(f)}
function addT(){var n=ev("tn"),t=ev("tt");if(!n||!t)return;D.testi.unshift({n:n,t:t});save();go()}
function sendWA(){var m=ev("cm");if(!m)return;window.open("https://wa.me/"+D.wa+"?text="+encodeURIComponent((ev("cn")||"Pengunjung")+": "+m),"_blank")}
function go(){var h=location.hash.slice(1)||"home";
 document.getElementById("menu").innerHTML=pages.map(function(p){return '<a href="#'+p[0]+'"'+(h==p[0]?' class="on"':'')+'>'+p[1]+'</a>'}).join("")+'<a href="#admin"'+(h=="admin"?' class="on"':'')+'>⚙ Admin</a>';
 document.getElementById("menu").classList.remove("open");
 document.getElementById("app").innerHTML=view(h);
 if(h=="produk")fil("all");if(h=="premium")fil("premium");window.scrollTo(0,0)}
window.addEventListener("hashchange",go);theme();go();
</script>
</body>
</html>
